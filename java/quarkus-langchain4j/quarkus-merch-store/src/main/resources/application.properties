quarkus.application.name=quarkus-merch-store

# Anthropic LangChain4j configuration
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-5
quarkus.langchain4j.anthropic.chat-model.max-tokens=2048

# Log prompts and completions
quarkus.langchain4j.anthropic.log-requests=true
quarkus.langchain4j.anthropic.log-responses=true

# Chat memory window
quarkus.langchain4j.chat-memory.type=message-window
quarkus.langchain4j.chat-memory.memory-window.max-messages=20

# OpenTelemetry — single OTLP endpoint for traces, metrics and logs
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.headers=${OTEL_EXPORTER_OTLP_HEADERS}
quarkus.otel.exporter.otlp.protocol=http/protobuf

quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# Trace context propagation
quarkus.otel.propagators=tracecontext,baggage

# HTTP port
quarkus.http.port=8080
