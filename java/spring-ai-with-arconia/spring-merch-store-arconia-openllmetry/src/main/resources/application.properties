spring.application.name=spring-merch-store
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

management.endpoints.web.exposure.include=*

arconia.observations.conventions.opentelemetry.ai.capture-content=true
arconia.observations.conventions.opentelemetry.ai.include-tool-definitions=true
arconia.observations.conventions.opentelemetry.ai.include-tool-call-content=true


arconia.observations.conventions.opentelemetry.ai.flavor=openllmetry